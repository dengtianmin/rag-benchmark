[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-host"
version = "0.1.0"
description = "Unified experiment host for enterprise product benchmark RAG/KGQA research."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8.2",
  "typer>=0.12.3",
  "orjson>=3.10.7",
  "pandas>=2.2.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
